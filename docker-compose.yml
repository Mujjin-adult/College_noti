services:
  fastapi:
    build: ./app
    command: > 
      python -m debugpy --listen 0.0.0.0:5725 --wait-for-client -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level info
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
      - "5725:5725"  # For debugging
    env_file: .env
    depends_on:
      - postgres
      - redis

  celery-worker:
    build: ./app
    container_name: celery-worker
    command: celery -A tasks worker --loglevel=INFO
    volumes:
      - ./app:/app
    env_file: .env
    depends_on:
      - redis
      - postgres

  celery-beat:
    build: ./app
    container_name: celery-beat
    command: celery -A tasks beat --loglevel=INFO
    volumes:
      - ./app:/app
    env_file: .env
    depends_on:
      - redis
      - postgres

  redis:
    image: redis
    expose:
      - 6379

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: school_notices
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler123
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  flower:
    image: mher/flower
    container_name: flower
    command: ['celery', '--broker=redis://redis:6379/0', 'flower', '--port=5555']
    ports:
      - "15555:5555"
    depends_on:
      - redis

volumes:
  pgdata: